{% load static %}
<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Ocena filmów{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'movies/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'movies/style.css' %}">
</head>
<body>
    <header class="bg-dark text-white">
        <nav class="container py-3 d-flex flex-wrap align-items-center gap-3" aria-label="Menu główne">
            <a class="brand me-auto" href="{% url 'catalog' %}">Ocena filmów</a>
            <a href="{% url 'catalog' %}">Katalog</a>
            <a href="{% url 'ranking' %}">Ranking</a>
            {% if user.is_authenticated %}
                <a href="{% url 'profile' %}">Profil</a>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button class="btn btn-outline-light btn-sm" type="submit">Wyloguj</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Logowanie</a>
                <a href="{% url 'register' %}">Rejestracja</a>
            {% endif %}
        </nav>
    </header>
    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>
    <footer class="container py-3 text-secondary border-top">Filmy i seriale — projekt grupy 9</footer>
</body>
</html>
