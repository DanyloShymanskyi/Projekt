{% extends 'base.html' %}
{% block content %}
<h2>Logowanie</h2>
<form method="post" class="mt-3">
    {% csrf_token %}
    {{ form.as_p }}
    {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
    {% endif %}
    <button type="submit" class="btn btn-primary">Zaloguj</button>
</form>
{% endblock %}
