{% extends 'base.html' %}
{% block title %}Rejestracja — Ocena filmów{% endblock %}
{% block content %}
<section class="box account">
    <h1 class="h3">Rejestracja</h1>
    <form class="form" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Utwórz konto</button>
    </form>
    <p class="mt-3 mb-0">Masz już konto? <a href="{% url 'login' %}">Zaloguj się</a>.</p>
</section>
{% endblock %}
